<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-decoration.png')"><div class="board"><div class="title">مَا الزَّخْرَفَةُ؟</div><video id="do" class="character" src="decoration-open.mp4" controls autoplay></video><div class="row" id="plain"><div class="shape sq pink"></div><div class="shape rect sky"></div></div><button class="btn" onclick="decorateNow()">هَيَّا نُزَخْرِفُ ✨</button><div id="decorMsg" class="msg"></div><button id="quiz" class="btn alt hidden" onclick="quizDecor()">أَيُّهُمَا مُزَخْرَفٌ؟</button><div id="decorQuiz" class="row hidden"></div><video id="dc" class="character hidden" src="decoration-close.mp4" controls></video></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('04-compare.html','06-watch-discover.html'));window.decorateNow=()=>{[...plain.children].forEach((x,i)=>{x.style.backgroundImage='repeating-linear-gradient(45deg,#f575aa 0 20px,#ffd04b 20px 40px,#4fc3ee 40px 60px)';x.animate([{transform:'scale(.9)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],900)});decorMsg.textContent='نُزَيِّنُ الْأَشْكَالَ فَنَصْنَعُ زَخَارِفَ جَمِيلَةً.';do.classList.add('hidden');quiz.classList.remove('hidden')};window.quizDecor=()=>{quiz.classList.add('hidden');decorMsg.textContent='اِخْتَرْنَ الشَّكْلَ الْمُزَخْرَفَ.';decorQuiz.innerHTML='<button class="card" onclick="decorAnswer(false)"><div class="shape sq pink"></div></button><button class="card" onclick="decorAnswer(true)"><div class="shape rect" style="background:repeating-linear-gradient(45deg,#f575aa 0 20px,#ffd04b 20px 40px,#4fc3ee 40px 60px)"></div></button>';decorQuiz.classList.remove('hidden')};window.decorAnswer=(ok)=>{if(!ok){decorMsg.textContent='حَاوِلْنَ مَرَّةً أُخْرَى.';return}decorMsg.textContent='أَحْسَنْتُنَّ! هَذَا شَكْلٌ مُزَخْرَفٌ.';decorQuiz.classList.add('hidden');do.classList.add('hidden');dc.classList.remove('hidden');dc.play().catch(()=>{})}});</script></body></html>
