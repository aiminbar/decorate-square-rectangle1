<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-decoration.png')"><div class="board"><div class="title">مَا الزَّخْرَفَةُ؟</div><video id="do" class="character" src="decoration-open.mp4" controls autoplay></video><div class="row" id="plain"><div class="shape sq pink"></div><div class="shape rect sky"></div></div><button id="decorateBtn" class="btn" type="button" onclick="decorateNow()" style="position:relative;z-index:50;pointer-events:auto;touch-action:manipulation">هَيَّا نُزَخْرِفُ ✨</button><div id="decorMsg" class="msg"></div><button id="quiz" class="btn alt hidden" onclick="quizDecor()">أَيُّهُمَا مُزَخْرَفٌ؟</button><div id="decorQuiz" class="row hidden"></div><video id="dc" class="character hidden" src="decoration-close.mp4" controls></video></div></main><nav style="position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:9999;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;pointer-events:none">
<button type="button" onclick="location.href='06-watch-discover.html'" style="pointer-events:auto;background:#fff;border:3px solid #f36aa4;border-radius:24px;padding:10px 22px;font:700 20px Arial;color:#e94f91">التالي</button>
<button type="button" onclick="location.href='index.html'" style="pointer-events:auto;background:#fff;border:3px solid #159fe0;border-radius:24px;padding:10px 24px;font:700 20px Arial;color:#138bc4">الرئيسية 🏠</button>
<button type="button" onclick="location.href='04-compare.html'" style="pointer-events:auto;background:#fff;border:3px solid #f36aa4;border-radius:24px;padding:10px 22px;font:700 20px Arial;color:#e94f91">السابق</button>
</nav><script src="common.js"></script>
<script>
(function () {
  function byId(id){ return document.getElementById(id); }

  window.decorateNow = function () {
    var plain = byId('plain');
    var msg = byId('decorMsg');
    var openingVideo = byId('do');
    var quizBtn = byId('quiz');

    if (!plain) return;

    var shapes = plain.children;
    for (var i = 0; i < shapes.length; i++) {
      shapes[i].style.background =
        'repeating-linear-gradient(45deg,#f575aa 0px,#f575aa 20px,#ffd04b 20px,#ffd04b 40px,#4fc3ee 40px,#4fc3ee 60px)';
      shapes[i].style.transform = 'scale(1.04)';
      (function(el){
        setTimeout(function(){ el.style.transform = 'scale(1)'; }, 250);
      })(shapes[i]);
    }

    if (msg) msg.textContent = 'نُزَيِّنُ الْأَشْكَالَ فَنَصْنَعُ زَخَارِفَ جَمِيلَةً.';
    if (openingVideo) {
      openingVideo.pause();
      openingVideo.classList.add('hidden');
    }
    if (quizBtn) quizBtn.classList.remove('hidden');
  };

  window.quizDecor = function () {
    var quizBtn = byId('quiz');
    var msg = byId('decorMsg');
    var decorQuiz = byId('decorQuiz');

    if (quizBtn) quizBtn.classList.add('hidden');
    if (msg) msg.textContent = 'اِخْتَرْنَ الشَّكْلَ الْمُزَخْرَفَ.';
    if (!decorQuiz) return;

    decorQuiz.innerHTML =
      '<button class="card" type="button" onclick="decorAnswer(false)"><div class="shape sq pink"></div></button>' +
      '<button class="card" type="button" onclick="decorAnswer(true)"><div class="shape rect" style="background:repeating-linear-gradient(45deg,#f575aa 0px,#f575aa 20px,#ffd04b 20px,#ffd04b 40px,#4fc3ee 40px,#4fc3ee 60px)"></div></button>';
    decorQuiz.classList.remove('hidden');
  };

  window.decorAnswer = function (ok) {
    var msg = byId('decorMsg');
    var decorQuiz = byId('decorQuiz');
    var openingVideo = byId('do');
    var closingVideo = byId('dc');

    if (!ok) {
      if (msg) msg.textContent = 'حَاوِلْنَ مَرَّةً أُخْرَى.';
      return;
    }

    if (msg) msg.textContent = 'أَحْسَنْتُنَّ! هَذَا شَكْلٌ مُزَخْرَفٌ.';
    if (decorQuiz) decorQuiz.classList.add('hidden');
    if (openingVideo) openingVideo.classList.add('hidden');
    if (closingVideo) {
      closingVideo.classList.remove('hidden');
      var p = closingVideo.play();
      if (p && p.catch) p.catch(function(){});
    }
  };

  var btn = byId('decorateBtn');
  if (btn) {
    btn.onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      window.decorateNow();
      return false;
    };
    btn.addEventListener('touchend', function (e) {
      e.preventDefault();
      window.decorateNow();
    }, {passive:false});
  }
})();
</script></body></html>
