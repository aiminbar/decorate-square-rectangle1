<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>خُطُواتُ عَمَلِي الْفَنِّيِّ</title><style>
.workstage{position:relative;width:min(88%,820px);height:270px;background:#fffdf7;border-radius:28px;padding:16px;overflow:hidden;box-shadow:0 6px 18px #0002;display:flex;align-items:center;justify-content:center}.paper{position:relative;width:82%;height:82%;background:#fff;border-radius:18px;box-shadow:0 4px 14px #0002;overflow:hidden}.demo-svg{width:100%;height:100%;display:block}.trace{fill:none;stroke:#168fd1;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900}.trace.go{animation:drawLine 1.6s ease forwards}.trace.r2.go{animation-delay:.45s}.cutline{fill:#f575aa;stroke:#777;stroke-width:4;stroke-dasharray:12 9}.scissor{position:absolute;font-size:48px;left:17%;top:58%;opacity:0;z-index:3}.scissor.go{opacity:1;animation:cutMove 2.1s ease-in-out forwards}.cutpiece{position:absolute;width:130px;height:105px;background:#f575aa;border-radius:12px;left:34%;top:29%;opacity:0}.cutpiece.go{animation:pieceOut .8s 1.7s ease forwards}.basecard{position:absolute;width:210px;height:145px;background:#fff2c7;border:4px solid #e3bd58;border-radius:18px;right:16%;top:22%}.gluepiece{position:absolute;width:125px;height:90px;background:#4fc3ee;border-radius:12px;left:13%;top:36%;z-index:2;box-shadow:0 4px 10px #0002}.gluepiece.go{animation:glueMove 1.8s 1.25s ease forwards}.gluestick{position:absolute;left:28%;top:22%;font-size:58px;z-index:4;opacity:0;transform:rotate(-25deg)}.gluestick.go{animation:glueBrush 1.25s ease forwards}.gluemark{position:absolute;left:36%;top:33%;width:105px;height:72px;border:8px dashed #f2c94c;border-radius:12px;opacity:0;z-index:1}.gluemark.go{animation:glueMark 1.1s .25s ease forwards}.decorShape{position:relative;width:260px;height:150px;background:#fff2c7;border:5px solid #e0b74d;border-radius:20px;overflow:hidden}.unit{position:absolute;width:42px;height:42px;border-radius:7px;opacity:0;transform:scale(.3)}.unit.go{animation:unitIn .45s ease forwards}.u1{background:#f575aa;right:22px;top:20px}.u2{background:#4fc3ee;right:76px;top:20px;animation-delay:.18s!important}.u3{background:#ffd04b;right:130px;top:20px;animation-delay:.36s!important}.u4{background:#9566e8;right:184px;top:20px;animation-delay:.54s!important}.u5{background:#4fc3ee;right:22px;top:78px;animation-delay:.72s!important}.u6{background:#f575aa;right:76px;top:78px;animation-delay:.9s!important}.u7{background:#9566e8;right:130px;top:78px;animation-delay:1.08s!important}.u8{background:#ffd04b;right:184px;top:78px;animation-delay:1.26s!important}.orderbox{display:none;width:92%;background:#fffdf7;border-radius:24px;padding:14px}.orderbox.show{display:block}.ordercards,.ordertargets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px}.ordercard,.target{min-width:135px;padding:12px;border-radius:16px;font-size:20px;font-weight:900}.ordercard{background:#fff;border:3px solid #9b6be8;cursor:grab;touch-action:none}.target{background:#f5f0ff;border:3px dashed #9b6be8;min-height:58px}.target.ok{background:#e7ffe9;border-style:solid}.activeStep{background:#fff2b8!important;transform:translateY(-3px)}
@keyframes drawLine{to{stroke-dashoffset:0}}@keyframes cutMove{0%{left:17%;top:58%;transform:rotate(-20deg)}35%{left:35%;top:23%;transform:rotate(20deg)}70%{left:53%;top:23%;transform:rotate(90deg)}100%{left:55%;top:62%;transform:rotate(170deg)}}@keyframes pieceOut{to{opacity:1;transform:translateY(32px) rotate(5deg);box-shadow:0 8px 15px #0003}}@keyframes glueMove{to{left:58%;top:31%;transform:scale(.92)}}@keyframes glueBrush{0%{opacity:0;left:28%;top:22%}15%{opacity:1}45%{left:42%;top:38%;transform:rotate(10deg)}80%{left:50%;top:48%;transform:rotate(-8deg)}100%{opacity:0;left:55%;top:42%}}@keyframes glueMark{0%{opacity:0}35%{opacity:1}100%{opacity:.75}}@keyframes unitIn{to{opacity:1;transform:scale(1)}}
@media(max-width:800px){.workstage{height:230px;width:96%}.step{font-size:18px;padding:9px}.basecard{right:8%}.decorShape{transform:scale(.82)}}
</style></head><body><main class="page" style="background-image:url('bg-steps.png')"><div class="board"><div class="title">خُطُواتُ عَمَلِي الْفَنِّيِّ</div><video id="so" class="character" src="steps-open.mp4" controls autoplay playsinline></video><div class="stepbar"><button class="step" data-n="1" onclick="runStep(1)">١ أَرْسُمُ 🔊</button><button class="step" data-n="2" onclick="runStep(2)">٢ أَقُصُّ 🔊</button><button class="step" data-n="3" onclick="runStep(3)">٣ أُلْصِقُ 🔊</button><button class="step" data-n="4" onclick="runStep(4)">٤ أُزَخْرِفُ 🔊</button></div><div id="stepArea" class="workstage"><div id="visual"></div></div><div id="stepMsg" class="msg">اِخْتَارِي خُطْوَةً.</div><video id="warn" class="character hidden" src="minbar-warning.mp4" controls playsinline></video><button id="orderBtn" class="btn alt" onclick="showOrder()">رَتِّبِي الْخُطُواتِ 🧩</button><div id="orderBox" class="orderbox"><div class="msg">رَتِّبِي: أَرْسُمُ ← أَقُصُّ ← أُلْصِقُ ← أُزَخْرِفُ</div><div id="orderCards" class="ordercards"></div><div id="targets" class="ordertargets"></div><div id="orderFeedback" class="feedback"></div></div><video id="sc" class="character hidden" src="steps-close.mp4" controls playsinline></video><audio id="aud"></audio></div></main><script src="common.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('07-demonstration.html','09-try-together.html'));showDraw(false)});
const files=['','draw.wav','cut.wav','glue.wav','decorate.wav'];const msgs=['','أَرْسُمُ الشَّكْلَ الْهَنْدَسِيَّ.','أَقُصُّ الشَّكْلَ الْهَنْدَسِيَّ.','أُلْصِقُ الشَّكْلَ الْهَنْدَسِيَّ.','أُزَخْرِفُ الشَّكْلَ.'];
function mark(n){document.querySelectorAll('.step').forEach(b=>b.classList.toggle('activeStep',+b.dataset.n===n));stepMsg.textContent=msgs[n];aud.src=files[n];aud.currentTime=0;aud.play().catch(()=>{})}
function showDraw(play=true){visual.innerHTML=`<div class="paper"><svg class="demo-svg" viewBox="0 0 700 220"><rect class="trace r1" x="390" y="48" width="145" height="125" rx="10"/><rect class="trace r2" x="120" y="62" width="215" height="100" rx="10"/></svg></div>`;if(play)setTimeout(()=>document.querySelectorAll('.trace').forEach(x=>x.classList.add('go')),80)}
function showCut(){visual.innerHTML=`<div class="paper"><div style="position:absolute;left:34%;top:29%;width:130px;height:105px;border:4px dashed #777;border-radius:12px;background:#f9b0cd88"></div><div class="cutpiece"></div><div class="scissor">✂️</div></div>`;setTimeout(()=>{document.querySelector('.scissor').classList.add('go');document.querySelector('.cutpiece').classList.add('go')},80)}
function showGlue(){visual.innerHTML=`<div class="paper"><div class="basecard"></div><div class="gluemark"></div><div class="gluestick">🧴</div><div class="gluepiece"></div></div>`;setTimeout(()=>{document.querySelector('.gluestick').classList.add('go');document.querySelector('.gluemark').classList.add('go');document.querySelector('.gluepiece').classList.add('go')},80)}
function showDecor(){visual.innerHTML=`<div class="decorShape">${Array.from({length:8},(_,i)=>`<span class="unit u${i+1}"></span>`).join('')}</div>`;setTimeout(()=>document.querySelectorAll('.unit').forEach(x=>x.classList.add('go')),80)}
window.runStep=n=>{mark(n);if(n===1)showDraw();if(n===3)showGlue();if(n===4)showDecor();if(n===2){warn.classList.remove('hidden');warn.currentTime=0;warn.play().catch(()=>{});visual.innerHTML='<div class="msg">⚠️ أَسْتَخْدِمُ الْمِقَصَّ بِحَذَرٍ.</div>';let done=()=>{warn.classList.add('hidden');showCut()};warn.onended=done;setTimeout(()=>{if(!warn.classList.contains('hidden')&&warn.paused)done()},3500)}};
const order=[{id:1,t:'أَرْسُمُ ✏️'},{id:2,t:'أَقُصُّ ✂️'},{id:3,t:'أُلْصِقُ 🖐️'},{id:4,t:'أُزَخْرِفُ 🎨'}];let selected=null;
window.showOrder=()=>{orderBtn.style.display='none';stepArea.style.display='none';stepMsg.style.display='none';orderBox.classList.add('show');let shuffled=[3,1,4,2];orderCards.innerHTML=shuffled.map(i=>`<button class="ordercard" data-id="${i}">${order[i-1].t}</button>`).join('');targets.innerHTML=order.map(x=>`<button class="target" data-need="${x.id}">${x.id}</button>`).join('');document.querySelectorAll('.ordercard').forEach(c=>c.onclick=()=>{selected=c;document.querySelectorAll('.ordercard').forEach(x=>x.style.outline='');c.style.outline='5px solid #ffd04b'});document.querySelectorAll('.target').forEach(t=>t.onclick=()=>place(t))};
function place(t){if(!selected)return;if(+selected.dataset.id===+t.dataset.need){t.textContent=selected.textContent;t.classList.add('ok');selected.remove();selected=null;if(!document.querySelector('.ordercard')){orderFeedback.textContent='أَحْسَنْتُنَّ! أَصْبَحْنَا مُسْتَعِدَّاتٍ لِلْعَمَلِ الْفَنِّيِّ. ⭐';setTimeout(()=>{so.classList.add('hidden');sc.classList.remove('hidden');sc.play().catch(()=>{})},600)}}else{t.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],350)}}
</script></body></html>
