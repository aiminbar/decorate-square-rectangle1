<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-demo.png')"><div class="board"><div class="title">أُزَخْرِفُ أَمَامَكُنَّ</div><video id="deOpen" class="character" src="demo-open.mp4" controls autoplay></video><div class="row"><button class="btn pinkb" onclick="kind='sq'">◻️ مُرَبَّعٌ</button><button class="btn" onclick="kind='rect'">▭ مُسْتَطِيلٌ</button><button class="btn alt" onclick="duplicate()">كَرِّرْ ✨</button><button class="btn" onclick="arrange()">نَظِّمْ 🪄</button></div><div class="row"><button class="color" style="background:#f575aa" onclick="col='#f575aa'"></button><button class="color" style="background:#4fc3ee" onclick="col='#4fc3ee'"></button><button class="color" style="background:#ffd04b" onclick="col='#ffd04b'"></button><button class="color" style="background:#9566e8" onclick="col='#9566e8'"></button></div><div id="workspace" style="width:75%;height:280px;background:#fff;border:4px solid #78aee7;border-radius:20px;position:relative" onclick="addShape(event)"></div><button class="btn alt" onclick="finishDemo()">أُكْمِلُ زَخْرَفَتِي ✨</button><video id="deClose" class="character hidden" src="demo-close.mp4" controls></video></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('06-watch-discover.html','08-art-steps.html'));window.kind='sq';window.col='#f575aa';let selected=null;window.addShape=e=>{if(e.target!==workspace)return;let d=document.createElement('div');d.className=window.kind==='sq'?'smallshape':'smallrect';d.style.cssText=`position:absolute;left:${e.offsetX-30}px;top:${e.offsetY-30}px;background:${window.col};cursor:move`;d.onclick=ev=>{ev.stopPropagation();selected=d};workspace.appendChild(d);selected=d};window.duplicate=()=>{if(!selected)return;let n=selected.cloneNode();n.style.left=(parseInt(selected.style.left)+75)+'px';n.onclick=selected.onclick;workspace.appendChild(n);selected=n};window.arrange=()=>{[...workspace.children].forEach((x,i)=>{x.style.left=(20+i*100)+'px';x.style.top='100px'})};window.finishDemo=()=>{deClose.classList.remove('hidden');deClose.play()}});</script></body></html>
