<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><style>#to.character,#tc.character,#to+canvas.character,#tc+canvas.character{left:-15%;bottom:8%;width:min(18vw,210px);max-height:32vh}@media(max-width:900px){#to.character,#tc.character,#to+canvas.character,#tc+canvas.character{left:-10%;bottom:6%;width:min(16vw,150px)}}</style><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page"><div class="board"><div class="title">لِنُجَرِّبْ مَعًا</div><video id="to" class="character" src="try-open.mp4" controls autoplay></video><div class="row"><button class="btn pinkb" data-try-shape="sq" onclick="selectShape('sq',this)">◻️ مُرَبَّعٌ</button><button class="btn" data-try-shape="rect" onclick="selectShape('rect',this)">▭ مُسْتَطِيلٌ</button><button class="color" style="background:#f575aa" data-try-color onclick="selectColor('#f575aa',this)"></button><button class="color" style="background:#4fc3ee" data-try-color onclick="selectColor('#4fc3ee',this)"></button><button class="color" style="background:#ffd04b" data-try-color onclick="selectColor('#ffd04b',this)"></button><button class="color" style="background:#9566e8" data-try-color onclick="selectColor('#9566e8',this)"></button></div><div id="slots" class="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div class="row"><button class="btn" onclick="repeatTry()">كَرِّرْ ✨</button><button class="btn alt" onclick="addOther()">أُضِيفُ شَكْلًا آخَرَ</button><button class="btn pinkb" onclick="finishTry()">شَاهِدْنَ زَخْرَفَتَنَا!</button></div><video id="tc" class="character hidden" src="try-close.mp4" controls></video></div></main><script src="common.js"></script><script>
let tryShape='sq', tryColor='#f575aa', tryIndex=0, alternate=false;
function selectShape(v,btn){tryShape=v; document.querySelectorAll('[data-try-shape]').forEach(b=>b.classList.remove('activeStep')); if(btn)btn.classList.add('activeStep')}
function selectColor(v,btn){tryColor=v; document.querySelectorAll('[data-try-color]').forEach(b=>b.style.outline=''); if(btn)btn.style.outline='5px solid white'}
function repeatTry(){if(tryIndex>=6)return;const d=document.createElement('div');d.className=tryShape==='sq'?'smallshape':'smallrect';d.style.background=tryColor;slots.children[tryIndex++].appendChild(d);d.animate([{transform:'scale(.2)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],450)}
function addOther(){tryShape=tryShape==='sq'?'rect':'sq';const btn=document.querySelector(`[data-try-shape="${tryShape}"]`);selectShape(tryShape,btn)}
function finishTry(){if(tryIndex===0){for(let i=0;i<6;i++)repeatTry()}else while(tryIndex<6)repeatTry();to.classList.add('hidden');tc.classList.remove('hidden');tc.play().catch(()=>{})}
document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('08-art-steps.html','10-art-homeland.html'));const sq=document.querySelector('[data-try-shape="sq"]');if(sq)sq.classList.add('activeStep')});
</script></body></html>
