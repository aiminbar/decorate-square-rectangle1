<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-watch.png')"><div class="board"><div class="title">أُشَاهِدُ وَأَكْتَشِفُ</div><video id="wo" class="character" src="watch-open.mp4" controls autoplay></video><div class="cards" id="patterns"><div class="card">◻️ ▭ ◻️ ▭</div><div class="card">▭ ◻️ ▭ ◻️</div><div class="card">◻️ ◻️ ▭ ▭</div></div><button class="btn" onclick="discoverPattern()">هَيَّا نَكْتَشِفُ 🔍</button><div id="wm" class="msg"></div><video id="wc" class="character hidden" src="watch-close.mp4" controls></video></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('05-decoration.html','07-demonstration.html'));window.discoverPattern=()=>{wm.textContent='نُكَرِّرُ الْأَشْكَالَ فَنُكَوِّنُ زَخْرَفَةً.';patterns.querySelectorAll('.card').forEach(x=>x.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],800));setTimeout(()=>{wo.classList.add('hidden');wc.classList.remove('hidden');wc.play()},1200)}});</script></body></html>
