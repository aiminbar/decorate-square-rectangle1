<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page" style="background-image:url('bg-compare.png')"><div class="board"><div class="title">أُلاحِظُ وَأُقارِنُ</div><video id="cq" class="character" src="shapes-compare.mp4" controls autoplay></video><div id="squares" class="row"><div class="shape sq pink" style="width:80px;height:80px"></div><div class="shape sq sky" style="width:130px;height:130px"></div><div class="shape sq yellow" style="width:105px;height:105px"></div><div class="shape sq purple" style="width:155px;height:155px"></div></div><button class="btn" onclick="discoverCompare()">نَكْتَشِفُ ✨</button><div id="cm" class="msg"></div><video id="cr" class="character hidden" src="compare-result.mp4" controls></video></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('03-shapes.html','05-decoration.html'));window.discoverCompare=()=>{cm.textContent='تَخْتَلِفُ فِي الْحَجْمِ';let a=[...squares.children];a.sort((x,y)=>x.offsetWidth-y.offsetWidth).forEach(x=>squares.appendChild(x));setTimeout(()=>{cm.textContent='وَتَخْتَلِفُ فِي اللَّوْنِ';a.forEach(x=>x.animate([{filter:'brightness(1)'},{filter:'brightness(1.4)'},{filter:'brightness(1)'}],700))},1200);setTimeout(()=>{cm.textContent='وَكُلُّهَا مُرَبَّعَاتٌ! ⭐';cq.classList.add('hidden');cr.classList.remove('hidden');cr.play()},2500)}});</script></body></html>
