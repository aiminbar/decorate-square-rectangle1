<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>أزخرف بالمربع والمستطيل</title></head><body><main class="page"><div class="stars" id="stars"><span>☆</span><span>☆</span><span>☆</span><span>☆</span><span>☆</span></div><div class="board"><div class="assess"><div class="title" id="qtitle"></div><div id="qbody"></div><div id="fb" class="feedback"></div><button class="btn" onclick="speakQ()">🔊 إعادة السؤال</button></div><video id="lc" class="character hidden" src="lesson-close.mp4" controls></video></div></main><script src="common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend',nav('10-art-homeland.html','index.html'));let qi=0,sub=0;const qs=[{t:'أَتَعَرَّفُ الشَّكْلَ',voice:['أَيْنَ الْمُرَبَّعُ؟','أَيْنَ الْمُسْتَطِيلُ؟']},{t:'أُلَاحِظُ وَأُقَارِنُ',voice:['أَيُّهُمَا أَطْوَلُ؟']},{t:'أَكْتَشِفُ الزَّخْرَفَةَ',voice:['أَيُّهَا زَخْرَفَةٌ؟']},{t:'أُكْمِلُ النَّمَطَ',voice:['مَا الشَّكْلُ الَّذِي يُكْمِلُ الزَّخْرَفَةَ؟']},{t:'أُرَتِّبُ خُطُواتِ عَمَلِي',voice:['رَتِّبْنَ خُطُواتِ الْعَمَلِ الْفَنِّيِّ.']}];function render(){qtitle.textContent=qs[qi].t;fb.textContent='';if(qi===0){qbody.innerHTML='<div class="row"><button class="card" onclick="ans(\'sq\')">◻️ مُرَبَّعٌ</button><button class="card" onclick="ans(\'circle\')">⭕ دَائِرَةٌ</button><button class="card" onclick="ans(\'rect\')">▭ مُسْتَطِيلٌ</button></div>'}else if(qi===1){qbody.innerHTML='<div class="row"><button class="shape sq pink" onclick="ans(\'sq\')"></button><button class="shape rect sky" onclick="ans(\'rect\')"></button></div>'}else if(qi===2){qbody.innerHTML='<div class="cards"><button class="card" onclick="ans(\'one\')">◻️</button><button class="card" onclick="ans(\'pattern\')">◻️ ▭ ◻️ ▭</button><button class="card" onclick="ans(\'mess\')">◻️　▭<br>　◻️</button></div>'}else if(qi===3){qbody.innerHTML='<div class="msg">■ ▭ ■ ▭ ■ ❓</div><div class="row"><button class="card" onclick="ans(\'sq\')">■</button><button class="card" onclick="ans(\'rect\')">▭</button></div>'}else{qbody.innerHTML='<div class="msg">اِضْغَطْنَ الْخُطُواتِ بِالتَّرْتِيبِ.</div><div class="cards" id="finalOrder"><button class="card" data-n="3" onclick="orderTap(this)">🖐️ أُلْصِقُ</button><button class="card" data-n="1" onclick="orderTap(this)">✏️ أَرْسُمُ</button><button class="card" data-n="4" onclick="orderTap(this)">🎨 أُزَخْرِفُ</button><button class="card" data-n="2" onclick="orderTap(this)">✂️ أَقُصُّ</button></div><div id="orderProgress" class="msg">١ ← ٢ ← ٣ ← ٤</div>'}speakQ()}window.speakQ=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(qs[qi].voice[sub]||qs[qi].voice[0]))};window.ans=a=>{let ok=false;if(qi===0){ok=(sub===0&&a==='sq')||(sub===1&&a==='rect');if(ok&&sub===0){fb.textContent='أَحْسَنْتُنَّ!';sub=1;setTimeout(render,800);return}}else if(qi===1)ok=a==='rect';else if(qi===2)ok=a==='pattern';else if(qi===3)ok=a==='rect';else ok=a==='order';if(!ok){fb.textContent='حَاوِلْنَ مَرَّةً أُخْرَى.';return}fb.textContent='أَحْسَنْتُنَّ!';stars.children[qi].textContent='★';stars.children[qi].classList.add('done');setTimeout(()=>{qi++;sub=0;if(qi<5)render();else{qtitle.textContent='أَحْسَنْتُنَّ! ⭐⭐⭐⭐⭐';qbody.innerHTML='<div class="msg">أَنْتُنَّ فَنَّانَاتٌ مُبْدِعَاتٌ!</div>';lc.classList.remove('hidden');lc.play()}},900)};window.orderTap=(b)=>{if(qi!==4)return;const chosen=document.querySelectorAll('#finalOrder .card[data-picked="1"]').length+1;if(+b.dataset.n===chosen){b.dataset.picked='1';b.disabled=true;b.style.background='#e7ffe9';b.style.border='4px solid #35b86a';if(chosen===4)setTimeout(()=>ans('order'),350)}else{fb.textContent='حَاوِلْنَ مَرَّةً أُخْرَى.';b.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],300)}};render();});</script></body></html>
